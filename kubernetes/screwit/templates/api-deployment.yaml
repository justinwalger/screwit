apiVersion: apps/v1
kind: Deployment
metadata:
  name: screwit-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: screwit-api
  template:
    metadata:
      labels:
        app: screwit-api
    spec:
      containers:
        - name: screwit-api
          # No registry involved - this image only ever exists locally, loaded via
          # `minikube image load`/`kind load docker-image`. `IfNotPresent` uses that
          # local copy; `Always` tries (and fails) to pull it from Docker Hub instead.
          # After a rebuild + reload, run
          # `helm upgrade screwit ./kubernetes/screwit --set api.image.tag=<tag>`
          # to pick up the change - no file edit needed.
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
            - configMapRef:
                name: screwit-config
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Model download from HF Hub happens in the FastAPI lifespan before
          # /health can respond at all - startupProbe gives it up to 150s for that
          # before readiness/liveness start being evaluated, so a slow download
          # doesn't get mistaken for a hung container and killed.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: screwit-api-service
  labels:
    app: screwit-api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: screwit-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8080
