name: Deploy to Cloud Run

on:
  push:
    branches:
      - main 

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REPO_NAME: screwit
  REGISTRY: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/screwit

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK and Docker Auth
        uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push FastAPI Backend
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/backend:${{ github.sha }}
          docker build -t $IMAGE_TAG -f docker/Dockerfile.api .
          docker push $IMAGE_TAG

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK and Docker Auth
        uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Gradio Frontend
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/frontend:${{ github.sha }}
          docker build -t $IMAGE_TAG -f docker/Dockerfile.gradio .
          docker push $IMAGE_TAG

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_backend_image: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          TF_VAR_frontend_image: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          TF_VAR_hf_api_key: ${{ secrets.HF_API_KEY }}
          TF_VAR_hf_model_repo_id: ${{ secrets.HF_MODEL_REPO_ID }}
          TF_VAR_app_password: ${{ secrets.APP_PASSWORD }}
        run: |
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="prefix=screwit"
          terraform apply -auto-approve