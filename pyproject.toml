[project]
name = "screwit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
api = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "onnxruntime>=1.28.0",
    "numpy>=2.5.1",
    "pillow>=12.0.0",
    "opencv-python-headless>=4.9.0",
    "huggingface-hub>=1.26.0",
    "pydantic-settings>=2.11.0",
]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]
train = [
    "anomalib>=2.6.0",
    "huggingface-hub>=1.26.0",
    "onnx>=1.22.0",
    "pyyaml>=6.0.3",
    "wandb>=0.28.1",
]
ui = [
    "gradio>=5.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "httpx>=0.28.1",
    "pillow>=12.0.0",
    "pydantic-settings>=2.11.0",
]


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

[tool.ruff.lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are meant to be called in argument
# defaults (e.g. `model: Model = Depends(get_model)`), so exempt them from B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
division-by-zero = "ignore"

[tool.ty.src]
# Notebooks are exploratory/experimental - monkeypatches and loose typing there
# are expected, so don't hold them to the same type-checking bar as src/.
exclude = ["notebooks/**"]

[tool.pytest.ini_options]
# So `from src... import ...` resolves when pytest's rootdir isn't already on sys.path.
pythonpath = ["."]
